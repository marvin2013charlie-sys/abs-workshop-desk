name: Windows app

on:
  push:
    branches: [main]
    paths:
      - "main.js"
      - "preload.js"
      - "package.json"
      - "package-lock.json"
      - "icon.*"
      - "test/desk-check.mjs"
      - ".github/workflows/windows.yml"
  workflow_dispatch:

permissions:
  contents: write


jobs:
  build-test-publish:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 1. Install build tools and set this build's version
        shell: pwsh
        run: |
          npm ci
          npm version "1.4.${{ github.run_number }}" --no-git-tag-version --allow-same-version
          "NEW_VERSION=1.4.${{ github.run_number }}" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: 2. Build the Windows installer
        shell: pwsh
        run: |
          npx electron-builder --win nsis --x64 --publish never
          if (-not (Select-String -Path dist\latest.yml -Pattern "version: $env:NEW_VERSION" -Quiet)) { throw "latest.yml (what installed apps update from) is missing or has the wrong version" }
          Get-Content dist\latest.yml

      - name: 3. Install it (as a user would, silently)
        shell: pwsh
        run: |
          $setup = "dist\ABS-Workshop-Desk-Setup.exe"
          if (-not (Test-Path $setup)) { throw "Installer was not built" }
          "Installer: {0:N1} MB" -f ((Get-Item $setup).Length / 1MB)
          Start-Process -FilePath $setup -ArgumentList "/S" -Wait
          # The silent installer can hand back before its last file lands.
          for ($i = 0; $i -lt 30 -and -not $exe; $i++) {
            $exe = Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Filter "ABS MOTS.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
            if (-not $exe) { Start-Sleep -Seconds 2 }
          }
          if (-not $exe) { throw "ABS MOTS.exe was not installed" }
          "Installed: $($exe.FullName) (version $((Get-Item $exe.FullName).VersionInfo.ProductVersion))"
          if (-not (Test-Path (Join-Path $exe.DirectoryName "resources\app-update.yml"))) { throw "The app has no self-update settings" }
          "Self-update settings: OK"
          "EXE=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $desktop = [Environment]::GetFolderPath("Desktop")
          $start = Join-Path $env:APPDATA "Microsoft\Windows\Start Menu\Programs"
          if (-not (Test-Path (Join-Path $desktop "ABS MOTS.lnk"))) { throw "No desktop shortcut" }
          if (-not (Get-ChildItem $start -Recurse -Filter "ABS MOTS.lnk")) { throw "No Start menu shortcut" }
          "Desktop and Start menu shortcuts: OK"

      - name: 4. Open the app and check the ABS admin desk
        shell: pwsh
        run: |
          $app = Start-Process -FilePath $env:EXE -ArgumentList "--remote-debugging-port=9222" -PassThru
          node test/desk-check.mjs
          if ($LASTEXITCODE -ne 0) { throw "App check failed" }
          Start-Sleep -Seconds 2
          $title = (Get-Process -Name "ABS MOTS" | Where-Object { $_.MainWindowTitle } | Select-Object -First 1).MainWindowTitle
          "Window title: $title"
          if ($title -ne "(3) ABS MOTS") { throw "Waiting-bookings count did not reach the window title" }
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("windows-screen.png")
          Stop-Process -Name "ABS MOTS" -Force -ErrorAction SilentlyContinue

      - name: 5. Uninstall it
        shell: pwsh
        run: |
          Start-Sleep -Seconds 3
          $dir = Split-Path $env:EXE
          $un = Get-ChildItem $dir -Filter "Uninstall*.exe" | Select-Object -First 1
          if (-not $un) { throw "No uninstaller" }
          Start-Process -FilePath $un.FullName -ArgumentList "/S" -Wait
          Start-Sleep -Seconds 5
          if (Test-Path $env:EXE) { throw "App is still there after uninstall" }
          "Uninstalled cleanly"

      - name: Keep the installer and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-app
          path: |
            dist/ABS-Workshop-Desk-Setup.exe
            desk-screenshot.png
            windows-screen.png
          if-no-files-found: ignore

      - name: Keep the version now published (to test updating from it)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force prev | Out-Null
          gh release download desk -R ${{ github.repository }} -p "ABS-Workshop-Desk-Setup.exe" -D prev 2>$null
          if (Test-Path prev\ABS-Workshop-Desk-Setup.exe) { "Earlier version kept" } else { "No earlier version yet" }

      - name: 6. Publish the download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desk
          name: ABS Workshop Desk
          body: |
            The ABS MOTs & Auto Repairs admin desk as an app. Sign in with the workshop email and password.

            **Windows:** https://www.absmotsauto.co.uk/admin/download/windows
            **Android:** https://www.absmotsauto.co.uk/admin/download/android

            Every build is installed, opened and checked on Windows or an Android phone before it is published.
          files: |
            dist/ABS-Workshop-Desk-Setup.exe
            dist/ABS-Workshop-Desk-Setup.exe.blockmap
            dist/latest.yml
          make_latest: true

      - name: 7. Check an installed app updates itself to this version
        shell: pwsh
        run: |
          $prev = "prev\ABS-Workshop-Desk-Setup.exe"
          if (-not (Test-Path $prev)) { "No earlier version to update from"; exit 0 }
          $appDir = Join-Path $env:LOCALAPPDATA "Programs\abs-workshop-desk"
          if (Test-Path $appDir) { Remove-Item $appDir -Recurse -Force }
          Start-Process -FilePath $prev -ArgumentList "/S" -Wait
          $exe = (Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Filter "ABS MOTS.exe" | Select-Object -First 1).FullName
          $old = (Get-Item $exe).VersionInfo.ProductVersion
          "Installed the earlier version: $old"
          # Self-update arrived in 1.4.3; 1.4.0 (the first build) cannot update itself.
          if ([version]$old -lt [version]"1.4.3") {
            "That version came before self-update, so it cannot update itself; every version from 1.4.3 can."
            Start-Process -FilePath (Get-ChildItem (Split-Path $exe) -Filter "Uninstall*.exe").FullName -ArgumentList "/S" -Wait
            exit 0
          }
          $env:ABS_UPDATE_NOW = "1"
          Start-Process -FilePath $exe
          $deadline = (Get-Date).AddMinutes(8)
          do {
            Start-Sleep -Seconds 15
            $exe = (Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Filter "ABS MOTS.exe" -ErrorAction SilentlyContinue | Select-Object -First 1).FullName
            $now = if ($exe) { (Get-Item $exe).VersionInfo.ProductVersion } else { "" }
            "Installed version: $now"
          } until (($now -and [version]$now -ge [version]$env:NEW_VERSION) -or (Get-Date) -gt $deadline)
          Stop-Process -Name "ABS MOTS" -Force -ErrorAction SilentlyContinue
          # Windows reports four parts (1.4.4.0), the build three (1.4.4).
          if (-not $now -or [version]$now -lt [version]$env:NEW_VERSION) { throw "The installed app did not update itself from $old to $env:NEW_VERSION" }
          "Updated itself from $old to $now with nobody touching it"
          Start-Sleep -Seconds 3
          Start-Process -FilePath (Get-ChildItem (Split-Path $exe) -Filter "Uninstall*.exe").FullName -ArgumentList "/S" -Wait
